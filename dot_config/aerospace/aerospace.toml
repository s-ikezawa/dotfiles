# AeroSpace の設定（~/.config/aerospace/aerospace.toml）。
# AeroSpace に同梱のデフォルト設定（/Applications/AeroSpace.app/Contents/Resources/default-config.toml）を
# 写して、コメントを日本語に訳したもの。デフォルトから変えたところには【変更】と付けている。
# 変えた後は service モード（alt-shift-; の後）で esc を押すと読み直す。

# 互換性の維持と、廃止された設定の扱いのための設定の版
# 参照: https://nikitabobko.github.io/AeroSpace/guide#config-version
# 省略したときの値: config-version = 1
config-version = 2

# AeroSpace の起動後に実行するコマンドを書ける。
# 使えるコマンド: https://nikitabobko.github.io/AeroSpace/commands
# 【変更】フォーカスしているウィンドウに枠を付ける（JankyBorders を起動する）
after-startup-command = ['exec-and-forget ~/.config/aerospace/mode-border.sh']

# ログイン時に AeroSpace を起動する
start-at-login = false

# 設定ファイルを保存したら、自動で設定を読み直す
# true にした後、自動の読み直しを始めるために一度だけ手で読み直すこと
auto-reload-config = false

# 正規化（ウィンドウの入れ物の組み方を自動で整える）。参照: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# 参照: https://nikitabobko.github.io/AeroSpace/guide#layouts
# 'accordion-padding' はアコーディオン表示で、後ろのウィンドウを見せる幅
# 0 にすると、この機能を切れる
accordion-padding = 30

# 指定できる値: tiles|accordion
default-root-container-layout = 'tiles'

# 指定できる値: horizontal|vertical|auto
# 'auto' は、横長のモニター（高さより幅が大きいもの）では横に並べ（horizontal）、
#             縦長のモニター（幅より高さが大きいもの）では縦に並べる（vertical）
default-root-container-orientation = 'auto'

# フォーカスしているモニターが変わったら、マウスもそのモニターへ動かす
# この動きが嫌なら、設定から消すこと
# 参照: https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# 参照: https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# 省略したときの値: on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# これを切り替えると、macOS の「アプリケーションを隠す」（cmd-h）を事実上使えなくできる
# この機能を使わないのに、うっかり cmd-h や cmd-alt-h を押してしまう人に向く
# 参照: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# ウィンドウが 1 つも無く、画面に出ていないときでも残しておくワークスペースの一覧
# この設定は 'config-version = 2' から使える
# 省略したときの値: persistent-workspaces = []
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "A", "B",
                         "C", "D", "E", "F", "G", "I", "M", "N", "O", "P", "Q",
                         "R", "S", "T", "U", "V", "W", "X", "Y", "Z"]

# キー割り当てのモードが変わるたびに実行するコールバック
# 参照: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 参照: https://nikitabobko.github.io/AeroSpace/commands#mode
# 【変更】service モードの間は枠の色を変えて、モードに入っていることを分かるようにする
on-mode-changed = ['exec-and-forget ~/.config/aerospace/mode-border.sh']

focus-follows-mouse.enabled = false

# 指定できる値: (qwerty|dvorak|colemak)
# 参照: https://nikitabobko.github.io/AeroSpace/guide#key-mapping
key-mapping.preset = 'qwerty'

# ウィンドウどうしの隙間（inner-*）と、モニターの端との隙間（outer-*）
# 指定できる値:
# - 固定の値:       gaps.outer.top = 8
# - モニターごと:   gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                   この例では、どれにも当てはまらないときの値が 24 になる。
#                   モニターの指定のしかたは 'workspace-to-monitor-force-assignment' と同じ。
#                   参照:
#                   https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
gaps.inner.horizontal = 0
gaps.inner.vertical =   0
gaps.outer.left =       0
gaps.outer.bottom =     0
gaps.outer.top =        0
gaps.outer.right =      0

# 'main' モード（通常のモード）のキー割り当て
# 参照: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' モードは必ず書くこと
# 省略したときの値: mode.main.binding = {}
[mode.main.binding]

    # 使えるキーの一覧:
    # - 英字.             a, b, c, ..., z
    # - 数字.             0, 1, 2, ..., 9
    # - テンキーの数字.   keypad0, keypad1, keypad2, ..., keypad9
    # - ファンクションキー. f1, f2, ..., f20
    # - 特殊なキー.       minus, equal, period, comma, slash, backslash, quote, semicolon,
    #                     backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
    #                     backspace, tab, pageUp, pageDown, home, end, forwardDelete,
    #                     sectionSign（ISO キーボードだけ。ヨーロッパのキーボードだけ）
    # - テンキーの特殊キー. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
    #                     keypadMinus, keypadMultiply, keypadPlus
    # - 矢印キー.         left, down, up, right

    # 使える修飾キー: cmd, alt, ctrl, shift

    # 使えるコマンドの一覧: https://nikitabobko.github.io/AeroSpace/commands

    # 参照: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
    # 次の行のコメントを外すと、alt + enter でターミナルを開ける
    # （i3 と同じ）
    # alt-enter = '''exec-and-forget osascript -e \
    # 'tell application "Terminal" to tell (do script) to activate' '''

    # 参照: https://nikitabobko.github.io/AeroSpace/commands#layout
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    # 参照: https://nikitabobko.github.io/AeroSpace/commands#focus
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # 参照: https://nikitabobko.github.io/AeroSpace/commands#move
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # 参照: https://nikitabobko.github.io/AeroSpace/commands#resize
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # 参照: https://nikitabobko.github.io/AeroSpace/commands#workspace
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-a = 'workspace A' # 自分の設定では、要らないワークスペースの割り当ては消してよい
    alt-b = 'workspace B'
    alt-c = 'workspace C'
    alt-d = 'workspace D'
    alt-e = 'workspace E'
    alt-f = 'workspace F'
    alt-g = 'workspace G'
    alt-i = 'workspace I'
    alt-m = 'workspace M'
    alt-n = 'workspace N'
    alt-o = 'workspace O'
    alt-p = 'workspace P'
    alt-q = 'workspace Q'
    alt-r = 'workspace R'
    alt-s = 'workspace S'
    alt-t = 'workspace T'
    alt-u = 'workspace U'
    alt-v = 'workspace V'
    alt-w = 'workspace W'
    alt-x = 'workspace X'
    alt-y = 'workspace Y'
    alt-z = 'workspace Z'

    # 参照: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'
    alt-shift-a = 'move-node-to-workspace A'
    alt-shift-b = 'move-node-to-workspace B'
    alt-shift-c = 'move-node-to-workspace C'
    alt-shift-d = 'move-node-to-workspace D'
    alt-shift-e = 'move-node-to-workspace E'
    alt-shift-f = 'move-node-to-workspace F'
    alt-shift-g = 'move-node-to-workspace G'
    alt-shift-i = 'move-node-to-workspace I'
    alt-shift-m = 'move-node-to-workspace M'
    alt-shift-n = 'move-node-to-workspace N'
    alt-shift-o = 'move-node-to-workspace O'
    alt-shift-p = 'move-node-to-workspace P'
    alt-shift-q = 'move-node-to-workspace Q'
    alt-shift-r = 'move-node-to-workspace R'
    alt-shift-s = 'move-node-to-workspace S'
    alt-shift-t = 'move-node-to-workspace T'
    alt-shift-u = 'move-node-to-workspace U'
    alt-shift-v = 'move-node-to-workspace V'
    alt-shift-w = 'move-node-to-workspace W'
    alt-shift-x = 'move-node-to-workspace X'
    alt-shift-y = 'move-node-to-workspace Y'
    alt-shift-z = 'move-node-to-workspace Z'

    # 参照: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
    alt-tab = 'workspace-back-and-forth'
    # 参照: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # 参照: https://nikitabobko.github.io/AeroSpace/commands#mode
    alt-shift-semicolon = 'mode service'

# 'service' モードのキー割り当て
# 参照: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # 組み方をほどいて元に戻す
    f = ['layout floating tiling', 'mode main'] # フローティング（タイルに入れず自由に置く）とタイルを切り替える
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky はまだ使えない https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']
