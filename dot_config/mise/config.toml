# mise のグローバル設定。chezmoi が ~/.config/mise/config.toml として配置し、
# after フェーズの run_onchange_after_01-mise-bootstrap.sh(ツール・パッケージ)と
# run_onchange_after_03-macos-defaults.sh(macOS 設定)が適用する。
#
# 役割分担:
#   - パッケージ導入と macOS 設定 → mise（このファイル）
#   - 設定ファイルの配置        → chezmoi（テンプレートが必要なため）

# GitHub API のトークン。未認証だと 60 回/時で、`latest` を解決するツールが多いこの構成では
# 上限に当たる(kotlin-lsp の version_list_url など)。
#
# mise は gh の hosts.yml を直接読む経路も持っているが、gh は macOS では既定でトークンを
# Keychain に入れて hosts.yml には書かないので、それでは拾えない。gh を呼んで取り出す。
# 認証は `gh auth login` で済ませておく(未認証・gh 未導入なら取得に失敗して未認証扱いに
# 戻るだけで、壊れはしない)。
#
# 単に `gh auth token` と書くと動かない。mise は credential_command を自分の shims を
# 外した PATH で実行するため、mise で入れた gh が見つからない
# (debug ログに "mise-credential-helper: gh: command not found" が出る)。
# `mise exec` を挟むと実体の bin が PATH に載って解決できる。exec 自体は GitHub API を
# 叩かないので、ここから再帰することもない。
[settings.github]
credential_command = "mise exec gh -- gh auth token"

# まとめて更新するタスク。`mise run up`
# パッケージは mise 管理なので brew upgrade は要らない
# (Homebrew 本体は brew services 用の逃げ道として残してあるだけ)。
[tasks.up]
description = "mise 本体・ツール・パッケージをまとめて更新する"
run = [
  "mise self-update --yes",
  "mise upgrade --yes",
  "mise bootstrap packages upgrade --yes",
]

[tools]
# [bootstrap.packages] の mas: が使う。mise install が packages apply より先に走るので、
# brew:mas と違って同じ実行の中で必ず先に揃う。
mas = { version = "latest", os = ["macos"] }

# JDK。JAVA_HOME 環境変数は mise activate(.zshrc)が設定する。
# postinstall で ~/Library/Java/JavaVirtualMachines にリンクを張り、/usr/libexec/java_home・
# /usr/bin/java・Gradle のツールチェーン自動検出(mise は検出対象外)からも見えるようにする。
#   - /Library/Java/JavaVirtualMachines は root 所有で sudo が要るので、ユーザー側に置く。
#   - Contents/Info.plist を持たない配布版は java_home に登録できないので何もしない。
#   - mise にはアンインストール時のフックがないため、リンク先が消えたリンクは次のインストール時に
#     掃除する(残っている間も java_home は無視する)。
#   - postinstall はインストール時にしか走らない。既に入っている版は mise install --force java で張る。
java = { version = "temurin-26", postinstall = '''
jvm_dir="$HOME/Library/Java/JavaVirtualMachines"
[ -f "$MISE_TOOL_INSTALL_PATH/Contents/Info.plist" ] || exit 0
mkdir -p "$jvm_dir"
for link in "$jvm_dir"/mise-*.jdk; do
  [ -L "$link" ] && [ ! -e "$link" ] && rm "$link"
done
ln -sfn "$MISE_TOOL_INSTALL_PATH" "$jvm_dir/mise-${MISE_TOOL_INSTALL_PATH##*/}.jdk"
''' }

# Gradle。ユーザーホーム(依存キャッシュ・ラッパーが落とす Gradle 本体・
# 自動取得した JDK)は既定が ~/.gradle なので、GRADLE_USER_HOME で XDG の下へ移している
# (.zshenv)。ラッパー(gradlew)も同じ環境変数を見るので、両方まとめて移る。
gradle = "latest"

# Android CLI(android コマンド)。入るのはランチャーで、初回実行時に本体を
# $ANDROID_USER_HOME/bin/android-cli へダウンロードする(ANDROID_USER_HOME / ANDROID_HOME は .zshenv)。
android-cli = "latest"

# Node.js。npm は同梱される(corepack は同梱されない。Node 26.8.2 で確認)。
# npm i -g の入り先は既定だと node の実体の中(mise の installs/node/<version>)で、
# node を上げるたびに入れ直しになる。XDG_DATA_HOME の下へ移す設定は .zshenv。
node = "latest"

# pnpm。corepack が無いので単体で入れる。
# ストア・グローバル・キャッシュの場所は pnpm 自身が XDG_* を見るので設定は要らない。
# PATH を通すのは .zshenv(通っていないと pnpm add -g がエラーになる)。
pnpm = "latest"

# XcodeGen。project.yml から .xcodeproj を生成する。
# 配布物は macOS 向けの zip だけなので mas と同じく os で絞る。
# バイナリと一緒に入る share/(ビルド設定のプリセット)も必要で、aqua 版はそれごと展開される。
# キャッシュは --use-cache を付けたときだけ ~/.xcodegen/cache に書く(移す環境変数は無く、
# --cache-path はスペックごとのファイルパスなので放置している)。
xcodegen = { version = "latest", os = ["macos"] }

# Python。素の macOS には Xcode CLT の python3(3.9.6)しか無いので入れる。
# pip のキャッシュは XDG_CACHE_HOME、--user の入り先は ~/.local に落ちるため追加の
# 環境変数は要らない(REPL 履歴だけ .zshenv で移している)。
python = "latest"

# uv。Python のパッケージ・プロジェクト・Python 本体を扱う単体バイナリ(Rust 製)で、
# 動かすのに Python は要らない。`uv tool install` の入り先などは uv 自身が XDG_* を
# 見るので、環境変数の設定は要らない(詳細は .zshenv)。
uv = "latest"

# GitHub CLI。設定・状態・拡張の置き場は gh 自身が XDG_* を見るので環境変数は要らない
# (2.100.0 で確認。config は $XDG_CONFIG_HOME/gh、state は $XDG_STATE_HOME/gh、
#  拡張は $XDG_DATA_HOME/gh)。
#
# `gh auth login` しておくと mise も GitHub のトークンとして使う(上の [settings.github])。
gh = "latest"

# Neovim。公式リリースの macOS 向け tarball(nvim-macos-arm64.tar.gz)を展開して
# bin/nvim が shim になる。
#
# バックエンドを明示するのは、短縮名 `neovim` が vfox:mise-plugins/vfox-neovim に
# 解決されるため(`mise registry neovim` の並びが vfox → aqua で、先頭が採られる)。
# vfox は第三者の Lua プラグインを取得してローカルで実行する経路(mise のドキュメントも
# 「プラグインのコードはツール本体と同じく信頼が要る」と書いている)なので、mise 本体に
# スナップショットが同梱される aqua を使う。入るバイナリはどちらも同じ tarball。
# なお 0.11.2 より後のリリースは upstream が shasum を配っていないため、
# どちらのバックエンドでもチェックサム検証は行われない(0.12.5 のアセットで確認)。
#
# 設定・データ・状態・キャッシュの置き場は nvim 自身が XDG の既定と同じ場所を使うので
# 環境変数は要らない(0.12.5 で確認。$XDG_CONFIG_HOME/nvim, $XDG_DATA_HOME/nvim,
# $XDG_STATE_HOME/nvim, $XDG_CACHE_HOME/nvim)。
"aqua:neovim/neovim" = "latest"

# ripgrep(rg)。.gitignore を尊重して再帰的に検索する grep。
#
# 短縮名のまま書けるのは、レジストリの先頭が aqua:BurntSushi/ripgrep で、そこに
# チェックサム(sha256)の定義もあるため(`mise tool ripgrep` の Security 欄で確認)。
# neovim のようにバックエンドを明示する必要はない。
#
# 設定ファイルの場所は環境変数で与えるしかない(rg は既定の設定ファイルを読まず、
# $RIPGREP_CONFIG_PATH が指すファイルだけを読む)。今は設定を置いていないので設定しない。
ripgrep = "latest"

# tree-sitter の CLI。パーサを生成・ビルドするのに使う。
# Neovim 0.12 は tree-sitter を本体に取り込んだがパーサのインストーラは持っておらず、
# それを補う tree-sitter-manager.nvim がこの CLI を要求する(ビルドに使う C コンパイラは
# Xcode CLT の clang がそのまま使われる)。
#
# 短縮名のままでレジストリ先頭の aqua:tree-sitter/tree-sitter に解決される。
# 配布物は GitHub の artifact attestation で検証される
# (`mise tool tree-sitter` の Security 欄が github_attestations)。
tree-sitter = "latest"

# fzf。コマンドラインのファジーファインダーで、Neovim の fzf-lua が本体として呼ぶ
# (fzf-lua は UI だけを持ち、絞り込みは fzf に投げる)。単体でも使える。
#
# 短縮名のままでレジストリ先頭の aqua:junegunn/fzf に解決される。
# リリースに sha256 が並んでいるのでチェックサム検証が効く
# (`mise tool fzf` の Security 欄が checksum (sha256))。
fzf = "latest"

# herdr。コーディングエージェント(claude / codex / cursor …)を並べて動かすための
# ターミナルマルチプレクサ。端末を持つのはバックグラウンドのサーバなので、クライアントを
# 閉じても SSH が切れても走らせたエージェントは止まらない。サーバはクライアントが必要に
# なったときに自分で起こすため、常駐サービスとして登録する必要はない
# (Homebrew の formula には brew services 用の plist が付くが、mise で入れる分には不要)。
#
# 短縮名のままレジストリ先頭の aqua:herdrdev/herdr に解決される
# (次点は github:herdrdev/herdr で、入るのは同じリリースの生バイナリ)。
# upstream がチェックサムも attestation も配っていないため検証は行われない
# (`mise tool herdr` の Security 欄が [none]。v0.9.1 のアセットで確認)。
#
# 設定は ~/.config/herdr/config.toml で、XDG_CONFIG_HOME ではなくこのパスが固定
# (環境変数で変えるなら HERDR_CONFIG_PATH)。この環境では XDG_CONFIG_HOME が同じ場所を
# 指しているので設定は要らない。ログも同じディレクトリに置かれる。
#
# 自己更新の `herdr update` は使わない。実体は mise の installs/herdr/ の下にあり
# (`herdr status client` の binary 欄で確認)、そこを書き換えると mise の把握と食い違う。
# 更新は他のツールと同じく `mise run up` で行う。
herdr = "latest"

# mo。Markdown をブラウザで開くビューア(GFM・Shiki のシンタックスハイライト・Mermaid・KaTeX・
# GitHub Alerts に対応)。保存すると表示が追従する。
#
# 既定でバックグラウンドに回り、コマンドはすぐ返る。サーバは port 6275 に 1 つだけ立ち、
# 2 回目以降の `mo <file>` は新しく建てずに走っているサーバへファイルを足す
# (別セッションが要るなら -p で port を変える)。止めるのは `mo --shutdown`。
# 開いていたファイルは自動で保存され、次の起動で復元される。
#
# レジストリには無い(`mise registry mo` が tool not found)ので、バックエンドを明示する。
# aqua に定義があり(pkgs/k1LoW/mo)、sha256 の検証が効く
# (`mise tool aqua:k1LoW/mo` の Security 欄が checksum (sha256))。aqua の定義は
# リリースの checksums.txt を指しているが、実際の取得時に mise が使うのは GitHub API が
# 返すアセットの digest(MISE_VERBOSE=1 で "using GitHub API digest for checksum
# verification"。1.6.8 で確認)。upstream は Homebrew tap を案内しているが、mise で揃える。
#
# 設定ファイルは持たない(オプションはフラグのみ)。セッションの保存先は
# $XDG_STATE_HOME/mo/backup/mo-<port>.json、ログは $XDG_STATE_HOME/mo/log/ で、
# XDG_STATE_HOME を見る(未設定なら ~/.local/state)。.zshenv で設定済みなので追加は要らない。
"aqua:k1LoW/mo" = "latest"

# コンテナ。Docker Desktop は使わず、colima が lima で建てた Linux VM の中で docker の
# デーモンを動かし、ホストからは docker CLI で話す。
#
#   lima            VM の実体(limactl)。colima が PATH から呼ぶ
#   colima          VM と docker デーモンの起動・停止、docker context の用意
#   docker-cli      docker コマンド(クライアントのみ。デーモンは VM の中)
#   docker-compose  compose v2。docker 本体とは別配布の CLI プラグイン
#
# VM の設定(マウントなど)は chezmoi 側の dot_config/colima/_templates/default.yaml.tmpl、
# DOCKER_CONFIG は .zshenv。起動は手動(`colima start`)で、常駐させない。
#
# どれも短縮名のままレジストリ先頭に解決される。検証は `mise tool <name>` の Security 欄で、
# lima は sha256 と GitHub の artifact attestation、colima は sha256、docker-compose は sha256・
# attestation・SLSA。docker-cli(aqua:docker/cli)は取得元の download.docker.com が
# チェックサムを配っていないため検証は行われない([none]。2026-09-18 に確認)。
lima = "latest"
colima = "latest"
docker-cli = "latest"

# compose は単体バイナリなので、docker が CLI プラグインを探す $DOCKER_CONFIG/cli-plugins へ
# symlink を張って `docker compose` で呼べるようにする(`docker-compose` のままでも呼べる)。
# リンク先はインストール先の実体なので、バージョンを上げると postinstall が張り直す。
# DOCKER_CONFIG は .zshenv が設定する。install.sh からの初回実行ではまだ読まれていないので、
# 同じ既定値を組んで補う。
docker-compose = { version = "latest", postinstall = '''
plugins="${DOCKER_CONFIG:-${XDG_CONFIG_HOME:-$HOME/.config}/docker}/cli-plugins"
mkdir -p "$plugins"
ln -sfn "$MISE_TOOL_INSTALL_PATH/docker-compose" "$plugins/docker-compose"
''' }

# Kotlin の公式 LSP(JetBrains)。IntelliJ 本体と JBR を同梱するので DL 344 MB・展開後 1.1 GB。
#
# 配布物は JetBrains の CDN にしかない(GitHub リリースのアセットは 0 個で、リリース本文から
# CDN へリンクしているだけ)。そのため ubi/aqua も、mise のレジストリも使えない。
# Homebrew には cask と JetBrains 公式 tap の formula があるが、
#   - cask が $HOMEBREW_PREFIX/bin に張るのは deprecated な kotlin-lsp.sh で、起動のたび
#     stderr に警告を出す。実体の bin/intellij-server への安定パスも無い。
#   - tap の formula は intellij-server を直接張るが、tap が Homebrew の JSON API
#     メタデータを公開しておらず、mise が formula の Ruby 定義を評価しにいった先で
#     depends_on :macos を formula 名と解釈して失敗する(mise 2026.9.9)。
# よって http バックエンドで CDN から直接入れる。bin/intellij-server がそのまま shim になる。
#
# .sit は拡張子こそ StuffIt だが中身は zip(先頭が PK\x03\x04)なので format で明示する。
# アーカイブのルートは kotlin-server-<version>/ の 1 階層なので strip_components = 1。
# bin_path を指定すると strip_components の自動判定が効かなくなるため、両方を明示する。
# 完全性は CDN が並べて置いている .sha256 で毎回検証する(checksum_url)。
#
# バージョンは GitHub のリリース一覧から拾う。タグが kotlin-lsp/vN.N.N 形式で `v` 剥がしだけでは
# 足りないので version_regex を使い、API が新しい順に返すため version_order で semver 順にする。
#
# 同梱バイナリは JetBrains の Developer ID 署名はあるが notarize されていない
# (spctl -a -t open が source=Unnotarized Developer ID で reject する)ため、
# com.apple.quarantine が付くと Gatekeeper に弾かれる(Kotlin/kotlin-lsp#194)。
# mise の http バックエンドは quarantine を付けないので、対策は要らない。
[tools."http:kotlin-lsp"]
version = "latest"
os = ["macos"]
version_list_url = "https://api.github.com/repos/Kotlin/kotlin-lsp/releases"
version_regex = 'kotlin-lsp/v(\d+\.\d+\.\d+)'
version_order = "semver"
strip_components = 1
bin_path = "bin"

[tools."http:kotlin-lsp".platforms]
macos-arm64 = { url = "https://download.jetbrains.com/language-server/kotlin-server/{{version}}/kotlin-server-{{version}}-aarch64.sit", checksum_url = "https://download.jetbrains.com/language-server/kotlin-server/{{version}}/kotlin-server-{{version}}-aarch64.sit.sha256", format = "zip" }
macos-x64 = { url = "https://download.jetbrains.com/language-server/kotlin-server/{{version}}/kotlin-server-{{version}}.sit", checksum_url = "https://download.jetbrains.com/language-server/kotlin-server/{{version}}/kotlin-server-{{version}}.sit.sha256", format = "zip" }

[bootstrap.packages]
"brew-cask:1password" = { os = "macos" }
"brew-cask:1password-cli" = { os = "macos" }
"brew-cask:karabiner-elements" = { os = "macos" }
"brew-cask:google-chrome" = { os = "macos" }
"brew-cask:firefox" = { os = "macos" }
"brew-cask:ghostty" = { os = "macos" }
"brew-cask:claude" = { os = "macos" }
"brew-cask:obsidian" = { os = "macos" }
"brew-cask:visual-studio-code" = { os = "macos" }

# フォント。Nerd Font 版の UDEV Gothic(BIZ UDゴシック + JetBrains Mono)。
# 半角:全角 = 1:2 の NF / NFLG と、3:5 の 35NF / 35NFLG が一緒に入る。
# LG は行間を font に埋め込んだ版で、行間を設定できる Ghostty では使わない。
"brew-cask:font-udev-gothic-nf" = { os = "macos" }

"brew:chezmoi" = { os = "macos" }

# xcode-build-server。.xcodeproj/.xcworkspace と sourcekit-lsp の橋渡しをする
# Build Server Protocol の実装。プロジェクト直下に buildServer.json を作ると、
# sourcekit-lsp(Xcode 同梱)が Xcode のビルド設定を使って解析できるようになる。
# mise のレジストリに無く、GitHub リリースにもアセットが無い(中身は Python スクリプト)ので
# Homebrew の formula を使う。formula は shebang を書き換えて PATH の python3 を使わせる。
"brew:xcode-build-server" = { os = "macos" }

# Mac App Store。キーは ADAM ID(App Store の URL の id 以降の数字)。
# App Store へのサインインは手動で済ませておく。
# インストール後のライセンス同意などは .chezmoitemplates/xcode.sh の setup_xcode が行う
# (01-mise-bootstrap と 02-xcode から呼ぶ)。
"mas:497799835" = { os = "macos" }              # Xcode

################################################################################
# macOS 設定
#
# 値の型はそのまま plist の型になる（int / bool / string / float）。
# array / dict / date / data は警告付きでスキップされるため書かない。
# `defaults -currentHost` と sudo が要るシステムドメインも非対応。
################################################################################

[bootstrap.macos.defaults.NSGlobalDomain]
KeyRepeat = 1                                   # キーリピートの間隔を最速に
InitialKeyRepeat = 10                           # リピート開始までを最短に
AppleKeyboardUIMode = 3                         # Tab で全てのコントロール間を移動
AppleShowAllExtensions = true                   # すべての拡張子を表示
NSAutomaticSpellingCorrectionEnabled = false    # 自動修正
NSAutomaticCapitalizationEnabled = false        # 自動大文字
NSAutomaticQuoteSubstitutionEnabled = false     # スマート引用符
NSAutomaticDashSubstitutionEnabled = false      # スマートダッシュ
NSAutomaticPeriodSubstitutionEnabled = false    # ピリオドの自動入力

[bootstrap.macos.defaults."com.apple.inputmethod.Kotoeri"]
JIMPrefLiveConversionKey = false                # ライブ変換を無効化

[bootstrap.macos.defaults."com.apple.finder"]
AppleShowAllFiles = true                        # 隠しファイルを表示

[bootstrap.macos.defaults."com.apple.dock"]
tilesize = 16                                   # サイズを最小に
magnification = false                           # 拡大をオフ
orientation = "left"                            # 位置を左に
minimize-to-application = true                  # ウインドウをアプリケーションアイコンにしまう
autohide = true                                 # 自動で表示・非表示をオン
show-recents = false                            # 最近使用したアプリを表示しない

[bootstrap.macos.defaults."com.apple.WindowManager"]
StandardHideDesktopIcons = true                 # 項目を表示 > デスクトップをオフ
HideDesktop = true                              # 項目を表示 > ステージマネージャ使用時にをオフ
EnableStandardClickToShowDesktop = false        # 壁紙クリックでのデスクトップ表示を限定
GloballyEnabled = false                         # ステージマネージャをオフ
AutoHide = true                                 # 最近使用したアプリをステージマネージャに表示しない
StandardHideWidgets = true                      # ウィジェット表示 > デスクトップにをオフ
StageManagerHideWidgets = true                  # ウィジェット表示 > ステージマネージャにをオフ

# mise はアプリを kill しない方針なので、反映は自前で行う。
# killall は対象が居ないと 1 を返すため || true が必須。
[bootstrap.hooks.post-defaults]
run = "killall Finder Dock WindowManager 2>/dev/null || true"
