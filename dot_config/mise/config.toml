[tools]
# AppStore経由のツールをCLIでインストールできるように
mas = { version = "latest", os = ["macos"] }

# ターミナル上で動くエージェントマルチプレクサ
# インストール・更新のたびに Claude Code 連携 (SessionStart フック) も入れる/更新する。
# chezmoi 管理の herdr 設定は onboarding = false のため、初回起動時の連携インストール画面が出ない。
# CLAUDE_CONFIG_DIR は .zshenv で設定しているが、初回セットアップ時のスクリプトには
# まだ渡っていないので明示する。Claude の設定ディレクトリが無いと herdr が失敗し、
# postinstall の失敗は mise install 全体の失敗になるため、無ければ飛ばす。
herdr = { version = "latest", postinstall = """
dir="${CLAUDE_CONFIG_DIR:-${XDG_CONFIG_HOME:-$HOME/.config}/claude}"
if [ -d "$dir" ]; then
  CLAUDE_CONFIG_DIR="$dir" "$MISE_TOOL_INSTALL_PATH/herdr" integration install claude
else
  echo "herdr: $dir が無いため Claude 連携のインストールを飛ばします" >&2
fi
""" }

# シェルのプロンプト（設定は ~/.config/starship.toml）
starship = "latest"

# リポジトリを ~/Projects/<ホスト>/<オーナー>/<リポジトリ> に揃えて clone する（root は git の設定 ghq.root）
ghq = "latest"

# あいまい検索で一覧から選ぶ（.zshrc の Ctrl+G で ghq のリポジトリを選ぶのに使う）
fzf = "latest"

# 高速な grep（rg）。.gitignore を見て、無視されたファイルは検索しない
ripgrep = "latest"

# 高速な find（fd）。.gitignore を見て、無視されたファイルは出さない
fd = "latest"

# シンタックスハイライト付きの cat（bat）。.zshrc の Ctrl+T（fzf）のプレビューに使う
bat = "latest"

# git の差分を単語単位の色分けと行番号付きで表示する（delta）。git の core.pager に使う
delta = "latest"

# エージェント（Claude Code）が加えた変更をレビューするための差分ビューア（hunk）。
# git の pager は delta のままにして、レビューするときだけ herdr の隣のペインなどで
# `hunk diff --watch` を開く（作業ツリーの変更を追いかけて自動で再読み込みする）。
hunk = "latest"

# git のコミットグラフを TUI で見る（serie）。リポジトリで `serie` と打つ。表示だけで、コミットなどの操作はしない。
# グラフは文字でなく画像で描く（kitty の画像表示の仕組み。Ghostty は対応）ので、対応していないターミナルでは崩れる。
# mise の registry に無いので aqua から入れる
"aqua:lusingander/serie" = "latest"

# JSON を整形・抽出する（jq）。Claude Code のステータスライン（statusline.sh）でも使う。
# macOS にも /usr/bin/jq があるが、OS の更新でバージョンが変わらないよう mise で揃える。
# 補完は zsh 本体に _jq が入っているので生成しない。
jq = "latest"

# YAML / TOML / XML を jq と同じ書き方で整形・抽出・書き換える（mikefarah 版の yq）
yq = "latest"

# アイコンと git の状態付きの ls（eza）。.zshrc の ls・ll・tree と fzf のプレビューで使う
eza = "latest"

# よく行くフォルダへ `z <名前の一部>` で移動する（zoxide）。`zi` で候補を fzf から選ぶ
zoxide = "latest"

# エディタ（Neovim。設定は ~/.config/nvim）。簡単な差分は hunk、じっくりレビューするときは Neovim で見る
neovim = "latest"

# Tree-sitter の CLI。Neovim の tree-sitter-manager.nvim がパーサーをビルドするのに使う
tree-sitter = "latest"

# Node.js（LTS を追う）と pnpm。npm・pnpm でグローバルに入れたものの置き場所は .zshenv で XDG に揃える
node = "lts"
pnpm = "latest"

# Go。go install で入れたものの置き場所（GOPATH）は .zshenv で XDG に揃える
go = "latest"

# Python のパッケージ・プロジェクト管理（uv）。Python 本体も uv が入れる（uv python install）ので、mise では入れない。
# 置き場所は macOS でも XDG に従う（キャッシュ ~/.cache/uv、Python 本体と tool ~/.local/share/uv、設定 ~/.config/uv）。
# uv tool install で入れたコマンドは XDG_BIN_HOME（~/.local/bin。.zshenv で設定）に入る。
uv = "latest"

# AWS の CLI（aws）。認証情報と設定の置き場所は .zshenv で XDG に揃える（~/.config/aws）
aws-cli = "latest"

# Dev Container の CLI（devcontainer）。リポジトリの .devcontainer/devcontainer.json からコンテナを作って
# 中でコマンドを動かす（devcontainer up --workspace-folder . / devcontainer exec --workspace-folder . <コマンド>）。
# docker の CLI を呼ぶので、Colima を起動しておくこと（`colima start`）。
devcontainer-cli = "latest"

# Docker のコンテナ・ログ・イメージ・ボリュームを TUI で見て操作する（lazydocker）。
# .zshenv の DOCKER_HOST で Colima の VM につなぐ
lazydocker = "latest"

# Java（OpenJDK）。Gradle などで Kotlin のプロジェクトをビルドするのに使う。JAVA_HOME は mise が設定する
java = "latest"

# TypeScript。7 系は Go 製で、言語サーバーも組み込まれている（tsc --lsp --stdio。設定は ~/.config/nvim/lsp/tsgo.lua）。
# プロジェクトに入れた tsc（pnpm exec tsc など）があれば、そちらが使われる
"npm:typescript" = "latest"

# Go の言語サーバー（gopls。設定は ~/.config/nvim/lsp/gopls.lua）
"go:golang.org/x/tools/gopls" = "latest"

# Lua の言語サーバー（Neovim の設定を書くときに補完や診断を出す。設定は ~/.config/nvim/lsp/lua_ls.lua）
lua-language-server = "latest"

# 構文木で照合するコード検索・置換（ast-grep。sg という短い名前のコマンドも入る）。
# 改行や空白、コメントの違いを気にせず、関数呼び出しなどを形で探して書き換えられる。
# TS・Go・Kotlin などに対応。主に Claude Code が使う（使い方は ~/.config/claude/CLAUDE.md）。
ast-grep = "latest"

# シェルスクリプトの間違いを見つける（shellcheck）。主に Claude Code が、書いたスクリプトを確かめるのに使う。
# chezmoi のテンプレート（*.sh.tmpl）は {{ }} があってそのままでは読めないので、展開してから渡す:
#   chezmoi execute-template < run_once_before_02-homebrew.sh.tmpl | shellcheck -s bash -
shellcheck = "latest"

# Docker 公式の言語サーバー（docker-language-server。設定は ~/.config/nvim/lsp/docker_language_server.lua）。
# Dockerfile と compose のファイルで補完・ホバー・診断（BuildKit のチェックや compose の書き方の誤り）を出す。
# mise の registry に無いので、GitHub のリリースから直接入れる（中身は実行ファイル 1 つ）
"github:docker/docker-language-server" = "latest"

# Dockerfile のリンター（hadolint）。ベストプラクティスに外れた書き方（apt-get のキャッシュを消していない、
# 版を固定していないなど）を指摘する。RUN の中のシェルは shellcheck でも確かめる。
# Neovim では保存したときなどに走らせ、警告を診断として出す（~/.config/nvim/lua/config/hadolint.lua）。
# 言語サーバーではないので、Claude Code は CLI で使う: hadolint <Dockerfile>
hadolint = "latest"

# シェルスクリプト（sh・bash）の言語サーバー（bash-language-server）。PATH にある shellcheck を内部で呼び、
# その警告を LSP の診断として返す。Claude Code の LSP ツール（~/.config/claude/marketplace の bash-lsp）と
# Neovim（~/.config/nvim/lsp/bashls.lua）で使う。zsh と chezmoi のテンプレート（*.sh.tmpl）には使えない
"npm:bash-language-server" = "latest"

# シェルスクリプトを整形する（shfmt）。既定はタブでインデントし、パイプの | を行末に置くので、
# Google の Shell Style Guide（~/.config/nvim/after/ftplugin/sh.lua と同じスペース 2 つ。| は行の先頭）に合わせて
# -i 2（スペース 2 つ）-ci（case の中もインデント）-bn（| や && を行の先頭に置く）を付けて使う:
#   shfmt -i 2 -ci -bn -d <ファイル>（差分を見る）  shfmt -i 2 -ci -bn -w <ファイル>（書き換える）
# プロジェクトに .editorconfig があれば、shfmt はそちらの indent_style・indent_size を使う。
shfmt = "latest"

# Kotlin の言語サーバー（JetBrains の kotlin-lsp。設定は ~/.config/nvim/lsp/kotlin_lsp.lua）。
# Homebrew の tap は新しい版が出ても追いつくのが遅いので、JetBrains の配布サイトから直接落とす。
# 版は GitHub のリリースの一覧（タグは kotlin-lsp/v<版>）から探す。中身は zip で、拡張子だけ .sit になっている。
# コマンドの名前は intellij-server。rename_exe で kotlin-lsp に変えると、mise の作業フォルダの名前が
# 長くなりすぎて入れられない（mise 2026.11.1）ため、元の名前のまま使う。
# 起動すると同梱の EULA に同意したことになる（内容は intellij-server --show-eula）。
# 表の見出しの後のキーは次の見出しまですべてこの表に入るので、[tools] の最後に置くこと。
[tools."http:kotlin-lsp"]
version = "latest"
version_list_url = "https://api.github.com/repos/Kotlin/kotlin-lsp/releases"
version_regex = 'kotlin-lsp/v(\d+\.\d+\.\d+)'
version_order = "semver" # 一覧の並びは新しい順でないうえ、古い形式の版（0.253.x）も混ざるので、版の大小で並べる
format = "zip"
strip_components = 1                              # kotlin-server-<版>/ の 1 階層を外す
bin_path = "bin"

[tools."http:kotlin-lsp".platforms]
macos-arm64 = { url = "https://download.jetbrains.com/language-server/kotlin-server/{{ version }}/kotlin-server-{{ version }}-aarch64.sit", checksum_url = "https://download.jetbrains.com/language-server/kotlin-server/{{ version }}/kotlin-server-{{ version }}-aarch64.sit.sha256" }
macos-x64 = { url = "https://download.jetbrains.com/language-server/kotlin-server/{{ version }}/kotlin-server-{{ version }}.sit", checksum_url = "https://download.jetbrains.com/language-server/kotlin-server/{{ version }}/kotlin-server-{{ version }}.sit.sha256" }

# GitHub API のトークンを gh から取得する（匿名のレートリミット対策）。
# gh はトークンを macOS のキーチェーンに保存するため、mise が自動で読む hosts.yml には
# 書かれない。credential_command で gh に問い合わせればトークンをファイルに書かずに済む。
[settings.github]
credential_command = 'gh auth token --hostname "$MISE_CREDENTIAL_HOST"'

# go install の入れ先（GOBIN）を mise に設定させない。
# 既定では Go の版のフォルダ（installs/go/<版>/bin）になり、Go を上げると入れたものが消えるため。
# GOBIN を設定しなければ $GOPATH/bin（.zshenv で XDG_DATA_HOME の下にしている）に入る。
[settings.go]
set_gobin = false

################################################################################
# タスク
################################################################################
# mise 本体と [tools]、[bootstrap.packages]（Homebrew / App Store）、gh で入れた Claude Code の skill を
# まとめて更新する（skill を入れるのは run_onchange_after_02-claude-skills）。
# `mise run up` で実行する。`mise up` は組み込みの `mise upgrade` の別名で [tools] しか更新しないので、run を省かないこと。
# dir をホームに固定するのは、プロジェクト内で実行してもそのプロジェクトのツールや
# mise.lock を巻き込まないようにするため。
# mas は root でないとき自分で sudo を呼び直すが、mise が出力を取り込むのでパスワードを
# 聞かれても何の入力か分からない。そこで先に認証し、brew の更新中に既定タイムアウト（5 分）で
# 切れないよう延長し続ける（入出力を切り離す理由などは 02-homebrew を参照）。
[tasks.up]
description = "mise 本体とツール、Homebrew・App Store のパッケージ、Claude Code の skill をまとめて更新する"
dir = "{{ env.HOME }}"
raw = true
run = """
#!/usr/bin/env bash
set -euo pipefail

echo "sudo の認証（App Store アプリの更新に必要）"
sudo -v
while kill -0 "$$" 2>/dev/null && sudo -n true 2>/dev/null; do sleep 30; done \
  </dev/null >/dev/null 2>&1 &
sudo_keepalive_pid=$!
trap 'pkill -P "${sudo_keepalive_pid}" 2>/dev/null; kill "${sudo_keepalive_pid}" 2>/dev/null; true' EXIT

mise self-update --yes
mise upgrade
mise bootstrap packages upgrade --yes
gh skill update --all
"""

################################################################################
# ツールの導入
################################################################################
[bootstrap.packages]
# CLIツール
"brew:git" = { os = "macos" }
"brew:chezmoi" = { os = "macos" }

# GitHub CLI（PR や Issue、CI の確認をエージェントからも行う）。
# mise の credential_command から呼ぶため、非対話シェルでも PATH にある Homebrew で入れる。
"brew:gh" = { os = "macos" }

# GNU 版のコマンド。macOS 標準の BSD 版はオプションや挙動が違い（sed -i、grep -P、find -printf など）、
# Linux 向けに書かれた手順やスクリプトがそのままでは動かないため。
# g 接頭辞なしの名前は <prefix>/opt/<formula>/libexec/gnubin に入り、.zshenv で BSD 版より前に PATH に入れている。
"brew:coreutils" = { os = "macos" }   # ls・cp・date・readlink など
"brew:gnu-sed" = { os = "macos" }     # sed
"brew:grep" = { os = "macos" }        # grep・egrep・fgrep
"brew:findutils" = { os = "macos" }   # find・xargs・locate

# Docker。macOS では Linux の VM の中で動かすので、VM を用意する Colima（`colima start` で起動する）と
# docker の CLI を入れる。Docker Desktop・OrbStack と違い、業務で使っても有料のライセンスが要らない。
# VM の設定（メモリなど）は ~/.config/colima/_templates/default.yaml。
# compose と buildx は docker のプラグインで、docker が探す場所に置かないと `docker compose` で動かない。
# Homebrew は <prefix>/lib/docker/cli-plugins に入れるので、~/.config/docker/config.json の
# cliPluginsExtraDirs でその場所を教えている（modify_config.json）。
# mise（aqua）でも入れられるが、プラグインが mise のフォルダに入り、symlink を張らないと動かないので Homebrew にする。
"brew:colima" = { os = "macos" }
"brew:docker" = { os = "macos" }          # CLI だけ（Docker Desktop ではない）
"brew:docker-compose" = { os = "macos" }  # docker compose
"brew:docker-buildx" = { os = "macos" }   # docker buildx（BuildKit でのビルド）
# docker login の認証情報を macOS のキーチェーンに預ける（docker-credential-osxkeychain）。
# 無いと config.json に base64 で書かれる。使うことは modify_config.json の credsStore で指定している
"brew:docker-credential-helper" = { os = "macos" }

# データベースのクライアント。サーバー本体は入れず、compose などでコンテナで動かすものにつなぐ。
# どちらも keg-only なので、PATH には .zshenv で入れている
"brew:libpq" = { os = "macos" }         # psql・pg_dump など（PostgreSQL）
"brew:mysql-client" = { os = "macos" }  # mysql・mysqldump など（MySQL）

# 画像の変換（ImageMagick の magick）。Neovim の snacks.nvim が Markdown の画像を表示するときに、
# PNG 以外（SVG・JPEG など）を PNG に変える
"brew:imagemagick" = { os = "macos" }
# SVG の変換（rsvg-convert）。ImageMagick は rsvg-convert があれば SVG の変換をそちらに任せる。
# ImageMagick に内蔵の変換（MSVG）は font-family にフォントを並べると読めずに失敗し、グラデーションなども崩れやすい
"brew:librsvg" = { os = "macos" }

# GUIツール
"brew-cask:1password" = { os = "macos" }
"brew-cask:1password-cli" = { os = "macos" }
"brew-cask:karabiner-elements" = { os = "macos" }
"brew-cask:google-chrome" = { os = "macos" }
"brew-cask:firefox" = { os = "macos" }
"brew-cask:ghostty" = { os = "macos" }

# VS Code。主に Dev Containers 拡張機能でコンテナの中を開くのに使う（拡張機能は下の post-packages で入れる）。
# docker の CLI と同じく、.zshenv の DOCKER_CONFIG にある Colima の context に接続する
# （Dock から開いても、VS Code は起動時にログインシェルの環境変数を読み込む）。
"brew-cask:visual-studio-code" = { os = "macos" }

# Lua で macOS を操作する（Hammerspoon）。ウィンドウを決まった位置に置いたり、一時的に中央に
# 大きく出して元に戻したりするのに使う。設定は ~/.config/hammerspoon/init.lua
# （置き場所は下の [bootstrap.macos.defaults."org.hammerspoon.Hammerspoon"] で変えている）
"brew-cask:hammerspoon" = { os = "macos" }

# Font
"brew-cask:font-udev-gothic-nf" = { os = "macos" }

# AppStore
"mas:497799835" = { os = "macos" } # Xcode

# VS Code の拡張機能を入れる（code は brew-cask:visual-studio-code が入れる）。
# 入っていれば何もしないので、毎回走ってよい。
[bootstrap.hooks.post-packages]
run = """
if command -v code >/dev/null 2>&1; then
  code --install-extension ms-vscode-remote.remote-containers  # Dev Containers
fi
"""

################################################################################
# macOS 設定
#
# 値の型はそのまま plist の型になる（int / bool / string / float）。
# array / dict / date / data は警告付きでスキップされるため書かない。
# `defaults -currentHost` と sudo が要るシステムドメインも非対応。
################################################################################
[bootstrap.macos.defaults.NSGlobalDomain]
KeyRepeat = 1                                   # キーリピートの間隔を最速に
InitialKeyRepeat = 10                           # リピート開始までを最短に
AppleKeyboardUIMode = 3                         # Tab で全てのコントロール間を移動
AppleShowAllExtensions = true                   # すべての拡張子を表示
NSAutomaticSpellingCorrectionEnabled = false    # 自動修正
NSAutomaticCapitalizationEnabled = false        # 自動大文字
NSAutomaticQuoteSubstitutionEnabled = false     # スマート引用符
NSAutomaticDashSubstitutionEnabled = false      # スマートダッシュ
NSAutomaticPeriodSubstitutionEnabled = false    # ピリオドの自動入力

[bootstrap.macos.defaults."com.apple.inputmethod.Kotoeri"]
JIMPrefLiveConversionKey = false                # ライブ変換を無効化

[bootstrap.macos.defaults."com.apple.finder"]
AppleShowAllFiles = true                        # 隠しファイルを表示
ShowPathbar = true                              # 下にパスバー（今いるフォルダまでの道筋）を出す
ShowStatusBar = true                            # 下にステータスバー（項目数と空き容量）を出す
NewWindowTarget = "PfHm"                        # 新しいウィンドウではホームを開く（既定は最近の項目）
FXDefaultSearchScope = "SCcf"                   # 検索は Mac 全体でなく、今いるフォルダの中から探す

# ネットワークドライブと USB メモリには .DS_Store を作らない（ほかの人や Windows から見えて邪魔になるため）
[bootstrap.macos.defaults."com.apple.desktopservices"]
DSDontWriteNetworkStores = true
DSDontWriteUSBStores = true

# スクリーンショットの保存先（location）はデスクトップでなく ~/Pictures/Screenshots にする。
# 値には絶対パスが要るが、~ は展開されず、mise のテンプレート（{{ env.HOME }}）もここでは展開されない
# （mise 2026.11.4 で確認）。そこで下の post-defaults でフォルダを作るときに $HOME を使って書く。
[bootstrap.macos.defaults."com.apple.screencapture"]
disable-shadow = true                           # ウィンドウを撮ったときに周りの影を付けない

[bootstrap.macos.defaults."com.apple.dock"]
tilesize = 16                                   # サイズを最小に
magnification = false                           # 拡大をオフ
orientation = "left"                            # 位置を左に
minimize-to-application = true                  # ウインドウをアプリケーションアイコンにしまう
autohide = true                                 # 自動で表示・非表示をオン
show-recents = false                            # 最近使用したアプリを表示しない

[bootstrap.macos.defaults."org.hammerspoon.Hammerspoon"]
MJConfigFile = "~/.config/hammerspoon/init.lua"  # 設定ファイルを ~/.hammerspoon でなく XDG の場所から読む

# Rex のフォントとテーマは init.lua で設定できず、設定画面の値がここに入る。
# フォントは Ghostty と同じ UDEV Gothic にしたいが、Rex の一覧には 35NF が出ないため NF にしている。
# テーマ（Catppuccin Mocha）は data 型の Workspace.customThemes に入り、darkThemeID もその中の
# ランダムな ID を指すので、ここでは管理できない。新しい Mac では手で入れる:
# Settings > Themes > Import a Ghostty or iTerm theme file で
# /Applications/Ghostty.app/Contents/Resources/ghostty/themes/Catppuccin Mocha を選び、Dark theme にする。
[bootstrap.macos.defaults."com.superlogical.rex"]
"Workspace.terminalFontName" = "UDEV Gothic NF"  # Settings > Terminal > Typography > Terminal font
"Workspace.terminalFontPointSize" = 14.0        # 同 Font size（Rex は float で保存する。14 だと int で書かれる）
# Ghostty の macos-option-as-alt = left と同じく、左 Option を Alt として送る（右 Option は特殊文字入力用に残す）
"Workspace.terminalOptionKeyBehavior" = "leftActsAsAlt"  # Settings > Terminal > Keyboard > Option key: Left sends Alt

[bootstrap.macos.defaults."com.apple.WindowManager"]
StandardHideDesktopIcons = true                 # 項目を表示 > デスクトップをオフ
HideDesktop = true                              # 項目を表示 > ステージマネージャ使用時にをオフ
EnableStandardClickToShowDesktop = false        # 壁紙クリックでのデスクトップ表示を限定
GloballyEnabled = false                         # ステージマネージャをオフ
AutoHide = true                                 # 最近使用したアプリをステージマネージャに表示しない
StandardHideWidgets = true                      # ウィジェット表示 > デスクトップにをオフ
StageManagerHideWidgets = true                  # ウィジェット表示 > ステージマネージャにをオフ

# スクリーンショットの保存先を作って設定する（上の com.apple.screencapture を参照）。
# mise はアプリを kill しない方針なので、反映は自前で行う。スクリーンショットの設定は SystemUIServer が読む。
# killall は対象が居ないと 1 を返すため || true が必須。
# フックは毎回走るが、mkdir -p も defaults write も何度やっても同じ結果になる。
[bootstrap.hooks.post-defaults]
run = """
mkdir -p "$HOME/Pictures/Screenshots"
defaults write com.apple.screencapture location -string "$HOME/Pictures/Screenshots"
killall Finder Dock WindowManager SystemUIServer 2>/dev/null || true
"""
