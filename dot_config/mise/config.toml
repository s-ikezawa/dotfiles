# mise のグローバル設定。chezmoi が ~/.config/mise/config.toml として配置し、
# after フェーズの run_onchange_after_01-mise-bootstrap.sh が適用する。
#
# 役割分担:
#   - パッケージ導入と macOS 設定 → mise（このファイル）
#   - 設定ファイルの配置        → chezmoi（テンプレートが必要なため）

# 言語ランタイムと CLI。mise がバージョンごと管理するもの。
[tools]
gh = "latest"

# リポジトリの取得先を ~/Projects/<host>/<org>/<repo> に強制する（root は git の
# ghq.root で指定）。git の includeIf がこのレイアウトを前提に会社用 identity を
# 切り替えるので、「どこに clone したか」で identity が決まる状態を作る土台でもある。
ghq = "latest"

# エージェントが書いた差分をレビューするためのターミナル diff ビューア。
# 実体は aqua:modem-dev/hunk。設定を置くなら ~/.config/hunk/config.toml で、
# 既に XDG 準拠なので chezmoi 側の追加は要らない（必要になるまで置かない）。
# `hunk update` は mise が置いたバイナリを直接差し替えるので使わないこと。
# 更新は `mise run up` に任せる。
hunk = "latest"

# 1Password CLI。chezmoi init がコミット用メールアドレスを金庫から読むのに使う
# （dotfiles は public なのでアドレスをリポジトリに置かない）。
# 使うのは chezmoi init のときだけで、通常の chezmoi apply では呼ばれない。
# 金庫の解錠にはデスクトップアプリとの連携が要る。連携が効かない場合は
# [bootstrap.packages] の "brew-cask:1password-cli" に寄せること。
"1password-cli" = "latest"

# ターミナルマルチプレクサ。設定は chezmoi 側の dot_config/herdr/config.toml。
# mise の registry 名で書く（実体は aqua:herdrdev/herdr）。
# github:<owner>/<repo> を直書きするとリポジトリ移管で壊れる
# （実際 ogulcancelik/herdr → herdrdev/herdr に移管済み）。
# Homebrew にも formula はあるが、バージョンを固定できないので [tools] を使う。
herdr = "latest"

# ls の代替。導入の目的は `tree`（.zshrc で `eza --tree` に別名を付けている）で、
# 素の tree は入れない。
# mise registry の eza は vfox:jdx/vfox-eza に解決され、cargo-quickinstall の
# ビルド済みバイナリを取ってくる（もう一方の cargo:eza はソースビルドになりうる）。
# Homebrew にも formula はあるが、[tools] ならバージョンが固定でき `mise run up` の
# 対象にもなる。代わりに zsh 補完は付かない（tarball にはバイナリしか入っていない）。
eza = "latest"

# あいまい検索。zsh プラグインの fzf-tab（補完メニューを fzf で選ぶ）が
# この実体を要求する。プラグインは [bootstrap.packages]、バイナリはここという分担
# （バイナリ 1 つで済み、バージョンを固定できるため）。
# Ctrl-R / Ctrl-T のキーバインドは .zshrc の `fzf --zsh` で読み込む。
fzf = "latest"

# 検索。ripgrep(rg) は grep、fd は find の代替で、どちらも .gitignore を既定で尊重する。
# fd は fzf の裏でも効く（.zshrc の FZF_DEFAULT_COMMAND）。既定の find のままだと
# Ctrl-T が node_modules や .git まで舐めて実用にならない。
ripgrep = "latest"
fd = "latest"

# JSON。gh / docker / colima の出力を扱うのに要る。
jq = "latest"

# cd 履歴へのジャンプ（z <部分文字列>）。.zshrc で init する。
# zi は候補選択に fzf を使うので、fzf とセットで効く。
zoxide = "latest"

# 色付き cat。fzf のプレビュー（.zshrc の FZF_CTRL_T_OPTS）に使う。
bat = "latest"

# コンテナ。Docker Desktop は使わず、colima が lima 上に建てた VM の中で
# docker daemon を動かし、ホストからは docker CLI だけで喋る。
#
#   lima            VM を作る土台。colima は limactl を PATH から呼ぶので単体で要る
#   colima          その上に docker daemon を用意し、docker context を張るところまでやる
#   docker-cli      docker コマンド本体。daemon は VM の中なので CLI だけでよい
#   docker-compose  CLI プラグイン。docker 本体とは別配布
#
# VM の設定は chezmoi 側の dot_config/colima/_templates/default.yaml。
lima = "latest"
colima = "latest"
docker-cli = "latest"

# compose は単体バイナリなので、docker が CLI プラグインとして探す場所
# （$DOCKER_CONFIG/cli-plugins）へ symlink する。$DOCKER_CONFIG は .zshenv で
# XDG 配下に寄せてある。symlink にするのは mise がバージョンを入れ替えても
# 参照先が installs 配下のまま追随するため。
docker-compose = { version = "latest", postinstall = """
mkdir -p "${DOCKER_CONFIG:-${XDG_CONFIG_HOME:-$HOME/.config}/docker}/cli-plugins" &&
ln -sfn "$MISE_TOOL_INSTALL_PATH/docker-compose" \
        "${DOCKER_CONFIG:-${XDG_CONFIG_HOME:-$HOME/.config}/docker}/cli-plugins/docker-compose"
""" }

# まとめて更新するタスク。`mise run up`
# パッケージは mise 管理なので brew upgrade は要らない
# (Homebrew 本体は brew services 用の逃げ道として残してあるだけ)。
[tasks.up]
description = "mise 本体・ツール・パッケージをまとめて更新する"
run = [
  "mise self-update --yes",
  "mise upgrade --yes",
  "mise bootstrap packages upgrade",
]

# ホストに入れるパッケージ。`os` で OS を絞れるので Linux と同居できる。
#   brew:      formula
#   brew-cask: cask（macOS のみ）
# mise は brew コマンドを呼ばず、Homebrew API から直接取得して
# /opt/homebrew に展開する。brew services は未実装なので、
# 常駐サービスが要るものはここに置かない。
[bootstrap.packages]
"brew-cask:1password" = { os = "macos" }

# karabiner-elements は app bundle ではなく pkg + DriverKit システム拡張。
# インストールに sudo が要り、システム設定での手動承認も必要。
# uninstall 側は sudo スクリプト・launchctl だらけなので packages prune で
# きれいに消えることは期待しないこと。
"brew-cask:karabiner-elements" = { os = "macos" }

# 開発時の動作確認用ブラウザ
"brew-cask:google-chrome" = { os = "macos" }
"brew-cask:firefox" = { os = "macos" }

# ターミナルと、そこで使うフォント。
# font-plemol-jp-nf に入っているのは Console 系 2 ファミリのみで、
# 素の "PlemolJP NF" は含まれない（PlemolJP Console NF / PlemolJP35 Console NF）。
"brew-cask:ghostty" = { os = "macos" }
"brew-cask:font-plemol-jp-nf" = { os = "macos" }

# zsh プラグイン。4 つとも依存ゼロの bottle で、言語処理系は連れてこない。
# プラグインマネージャ（sheldon 等）は置かない。読み込み順に強い制約があり
# （fpath 追加 → compinit → fzf-tab → autosuggestions → syntax-highlighting）、
# マネージャを挟むとその順序が設定ファイルに分散するため、.zshrc で直接 source する。
# 更新は [tasks.up] の `mise bootstrap packages upgrade` が拾う。
#
# sheldon を使わないもう 1 つの理由: 配布バイナリが Homebrew の openssl@3 に
# 動的リンクしていて単体では起動せず、formula で入れると openssl@3 / libgit2 /
# libssh2 / llhttp / ca-certificates が付いてくる。
"brew:zsh-completions" = { os = "macos" }
"brew:zsh-autosuggestions" = { os = "macos" }
"brew:zsh-syntax-highlighting" = { os = "macos" }
"brew:fzf-tab" = { os = "macos" }

################################################################################
# macOS 設定
#
# 値の型はそのまま plist の型になる（int / bool / string / float）。
# array / dict / date / data は警告付きでスキップされるため書かない。
# `defaults -currentHost` と sudo が要るシステムドメインも非対応。
################################################################################

[bootstrap.macos.defaults.NSGlobalDomain]
KeyRepeat = 1                                   # キーリピートの間隔を最速に
InitialKeyRepeat = 10                           # リピート開始までを最短に
AppleKeyboardUIMode = 3                         # Tab で全てのコントロール間を移動
AppleShowAllExtensions = true                   # すべての拡張子を表示
NSAutomaticSpellingCorrectionEnabled = false    # 自動修正
NSAutomaticCapitalizationEnabled = false        # 自動大文字
NSAutomaticQuoteSubstitutionEnabled = false     # スマート引用符
NSAutomaticDashSubstitutionEnabled = false      # スマートダッシュ
NSAutomaticPeriodSubstitutionEnabled = false    # ピリオドの自動入力

[bootstrap.macos.defaults."com.apple.inputmethod.Kotoeri"]
JIMPrefLiveConversionKey = false                # ライブ変換を無効化

[bootstrap.macos.defaults."com.apple.finder"]
AppleShowAllFiles = true                        # 隠しファイルを表示

[bootstrap.macos.defaults."com.apple.dock"]
tilesize = 16                                   # サイズを最小に
magnification = false                           # 拡大をオフ
orientation = "left"                            # 位置を左に
minimize-to-application = true                  # ウインドウをアプリケーションアイコンにしまう
autohide = true                                 # 自動で表示・非表示をオン
show-recents = false                            # 最近使用したアプリを表示しない

[bootstrap.macos.defaults."com.apple.WindowManager"]
StandardHideDesktopIcons = true                 # 項目を表示 > デスクトップをオフ
HideDesktop = true                              # 項目を表示 > ステージマネージャ使用時にをオフ
EnableStandardClickToShowDesktop = false        # 壁紙クリックでのデスクトップ表示を限定
GloballyEnabled = false                         # ステージマネージャをオフ
AutoHide = true                                 # 最近使用したアプリをステージマネージャに表示しない
StandardHideWidgets = true                      # ウィジェット表示 > デスクトップにをオフ
StageManagerHideWidgets = true                  # ウィジェット表示 > ステージマネージャにをオフ

# mise はアプリを kill しない方針なので、反映は自前で行う。
# killall は対象が居ないと 1 を返すため || true が必須。
[bootstrap.hooks.post-defaults]
run = "killall Finder Dock WindowManager 2>/dev/null || true"
