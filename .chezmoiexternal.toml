# chezmoi が外部から取ってきて配置するもの。https://www.chezmoi.io/reference/special-files/chezmoiexternal-format/
# chezmoi apply のときに、refreshPeriod より古ければ取り直す（chezmoi apply --refresh-externals で今すぐ）。

# zsh の補完候補の一覧を fzf で絞り込めるようにするプラグイン。.zshrc から source する。
# プラグインマネージャーは使わず、ここで clone して chezmoi apply で更新する。
[".local/share/zsh/plugins/fzf-tab"]
type = "git-repo"
url = "https://github.com/Aloxaf/fzf-tab.git"
refreshPeriod = "168h"
clone.args = ["--depth", "1"]
pull.args = ["--ff-only"]

# 履歴から入力の続きを薄く表示するプラグイン。→ か Ctrl+E で確定する。.zshrc から source する。
[".local/share/zsh/plugins/zsh-autosuggestions"]
type = "git-repo"
url = "https://github.com/zsh-users/zsh-autosuggestions.git"
refreshPeriod = "168h"
clone.args = ["--depth", "1"]
pull.args = ["--ff-only"]
